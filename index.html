<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autoškola – okruhy</title>

    <!-- Bootstrap (len grid) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f5f1e8;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        color: #3a2f25;
      }

      header {
        padding: 32px 16px;
        text-align: center;
        font-weight: 600;
        font-size: 1.6rem;
      }

      .start-test-wrapper {
        display: flex;
        justify-content: center;
        margin: -12px 0 28px;
      }

      .start-test-btn {
        border: 0;
        border-radius: 999px;
        padding: 12px 30px;
        background: #3f6f4e;
        color: #fff;
        font-weight: 700;
        box-shadow: 0 5px 14px rgba(63, 111, 78, 0.24);
        transition: transform 0.15s ease, background 0.15s ease;
      }

      .start-test-btn:hover {
        background: #315b3e;
        transform: translateY(-2px);
      }

      .okruh-card {
        background: #e8dfcf;
        border-radius: 16px;
        padding: 20px;
        height: 100%;
        cursor: pointer;
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
      }

      .okruh-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.1);
      }

      .okruh-title {
        font-size: 1.05rem;
        font-weight: 600;
        margin-bottom: 6px;
      }

      .okruh-count {
        font-size: 0.9rem;
        color: #6b5a4a;
      }
    </style>
  </head>

  <body>
    <header>📘 Okruhy autoškoly</header>

    <div class="start-test-wrapper">
      <button type="button" class="start-test-btn" onclick="location.href = 'test.html'">
        Start Test
      </button>
    </div>

    <main class="container pb-5">
      <div id="okruhy-grid" class="row g-4"></div>
    </main>

    <script src="tests.js"></script>
    <script src="questions.js"></script>
    <script src="ui.js"></script>
  </body>
</html>
