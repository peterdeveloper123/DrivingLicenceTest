<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autoškola – okruhy</title>

    <!-- Bootstrap (len grid) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f5f1e8;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        color: #3a2f25;
      }

      header {
        padding: 32px 16px;
        text-align: center;
        font-weight: 600;
        font-size: 1.6rem;
      }

      .okruh-card {
        background: #e8dfcf;
        border-radius: 16px;
        padding: 20px;
        height: 100%;
        cursor: pointer;
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
      }

      .okruh-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.1);
      }

      .okruh-title {
        font-size: 1.05rem;
        font-weight: 600;
        margin-bottom: 6px;
      }

      .okruh-count {
        font-size: 0.9rem;
        color: #6b5a4a;
      }
    </style>
  </head>

  <body>
    <header>📘 Okruhy autoškoly</header>

    <main class="container pb-5">
      <div id="okruhy-grid" class="row g-4"></div>
    </main>

    <script src="tests.js"></script>
    <script src="questions.js"></script>
    <script src="ui.js"></script>
  </body>
</html>
