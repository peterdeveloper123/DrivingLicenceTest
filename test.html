<!doctype html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N&aacute;hodn&yacute; test &ndash; Auto&scaron;kola</title>
  <style>
    :root{--bg:#f5f1e8;--card:#e8dfcf;--soft:#efe6d6;--text:#3a2f25;--muted:#6b5a4a;--green:#3f6f4e;--green-soft:#cfe3c4;--red:#9b4538;--red-soft:#e6c7c2}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}
    .test-header{max-width:960px;margin:auto;padding:24px 20px 12px;text-align:center}.test-header h1{margin:0 0 12px;font-size:clamp(1.55rem,4vw,2rem)}
    .test-meta{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px}.pill,.back-link{border-radius:999px;padding:8px 14px;background:var(--soft);color:var(--muted);text-decoration:none;font-weight:650}
    .timer{min-width:88px;font-variant-numeric:tabular-nums}.timer.warning{background:var(--red-soft);color:var(--red)}
    .test-shell{width:min(920px,calc(100% - 32px));margin:0 auto 56px}.question-nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(38px,1fr));gap:7px;margin:12px 0 20px}
    .nav-number{min-height:38px;border:1px solid #d3c5b1;border-radius:9px;background:var(--soft);color:var(--text);cursor:pointer}.nav-number.current{outline:3px solid rgba(63,111,78,.28);border-color:var(--green)}.nav-number.answered,.nav-number.correct-final{background:var(--green);border-color:var(--green);color:#fff}.nav-number.incorrect-final{background:var(--red);border-color:var(--red);color:#fff}
    .question-card,.results-card,.error-card{padding:clamp(20px,4vw,32px);border-radius:18px;background:var(--card);box-shadow:0 5px 15px rgba(0,0,0,.07)}.question-label{margin-bottom:8px;color:var(--muted);font-size:.92rem;font-weight:700}.question-text{margin:0 0 20px;font-size:clamp(1.1rem,3vw,1.3rem);line-height:1.45}.question-image{display:block;max-width:100%;max-height:420px;margin:0 auto 20px;border-radius:12px}
    .answers{display:grid;gap:10px}.answer-btn{width:100%;border:1px solid transparent;border-radius:11px;padding:13px 15px;background:var(--bg);color:var(--text);text-align:left;cursor:pointer;transition:.15s}.answer-btn:not(:disabled):hover{background:#fffaf0;transform:translateY(-1px)}.answer-btn:disabled{cursor:default;opacity:1}.answer-btn.correct{border-color:var(--green);background:var(--green-soft)}.answer-btn.wrong{border-color:var(--red);background:var(--red-soft)}
    .feedback{min-height:24px;margin:16px 0 0;font-weight:700}.feedback.correct{color:var(--green)}.feedback.wrong{color:var(--red)}.question-controls{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
    .control-btn,.finish-btn,.new-test-btn{border:0;border-radius:999px;padding:10px 18px;cursor:pointer;font-weight:700}.control-btn{background:var(--soft);color:var(--muted)}.control-btn:disabled{cursor:default;opacity:.45}.finish-row{display:flex;justify-content:center;margin-top:22px}.finish-btn,.new-test-btn{background:var(--green);color:#fff}.finish-btn:disabled{background:#a99e8e;cursor:not-allowed;opacity:.7}
    .result-status{margin:0 0 20px;font-size:clamp(1.8rem,6vw,2.7rem)}.result-status.passed{color:var(--green)}.result-status.failed{color:var(--red)}.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}.stat{padding:14px 8px;border-radius:12px;background:var(--bg);text-align:center}.stat strong{display:block;font-size:1.45rem}
    .category-results{width:100%;margin:20px 0;border-collapse:collapse}.category-results th,.category-results td{padding:9px 6px;border-bottom:1px solid #d3c5b1;text-align:left}.category-results :is(th,td):last-child{text-align:right}
    @media(max-width:540px){.test-shell{width:min(calc(100% - 20px),920px)}.question-nav{grid-template-columns:repeat(8,1fr)}.nav-number{min-height:34px;padding:0}.result-stats{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="test-header">
    <h1>N&aacute;hodn&yacute; test</h1>
    <div class="test-meta">
      <a class="back-link" href="index.html">&larr; Okruhy</a>
      <span class="pill" id="progress">0 / 40 zodpovedan&yacute;ch</span>
      <span class="pill timer" id="timer" aria-live="polite">30:00</span>
    </div>
  </header>
  <main class="test-shell">
    <nav class="question-nav" id="questionNav" aria-label="Navig&aacute;cia medzi ot&aacute;zkami"></nav>
    <section id="testContent"></section>
    <div class="finish-row"><button type="button" class="finish-btn" id="finishBtn" disabled>Dokon&#269;i&#357; test</button></div>
  </main>
  <script src="tests.js"></script>
  <script src="questions.js"></script>
  <script src="test.js"></script>
</body>
</html>
